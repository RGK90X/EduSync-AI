<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduSync AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0908;
    --bg-alt:#100e0b;
    --surface:#161310;
    --surface-2:#1e1a14;
    --surface-3:#251f17;
    --border:#332a1c;
    --border-bright:#4a3a22;
    --gold:#d4af37;
    --gold-bright:#f0cf6e;
    --gold-dim:#8a6d2c;
    --bronze:#b08d57;
    --text:#ffffff;
    --text-dim:#d8d2c4;
    --text-faint:#a89b81;
    --danger:#e2574c;
    --success:#7fbf8f;
    --warning:#e2a63c;
    --radius:14px;
    --radius-sm:8px;
    --shadow-gold: 0 0 0 1px rgba(212,175,55,.15), 0 8px 30px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(ellipse at top, #14110c 0%, var(--bg) 55%, #060504 100%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-weight:600;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh; display:flex; flex-direction:column; position:relative; z-index:1;}
  ::selection{ background: rgba(212,175,55,.3); }
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border-bright); border-radius:10px;}

  :focus-visible{ outline:2px solid var(--gold-bright); outline-offset:2px; border-radius:4px;}

  h1,h2,h3,.display{ font-family:'Sora',sans-serif; letter-spacing:-0.01em; font-weight:800; }

  .gold-text{
    background: linear-gradient(120deg, var(--gold-dim) 0%, var(--gold-bright) 25%, var(--gold) 50%, var(--gold-bright) 75%, var(--gold-dim) 100%);
    background-size:220% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: shimmer 6s linear infinite;
  }
  @keyframes shimmer{ to{ background-position: -220% center; } }
  .divider{ height:1px; background:linear-gradient(90deg, transparent, var(--border-bright), transparent); }

  /* ===================== AMBIENT BACKGROUND ===================== */
  .bg-fx{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .bg-orb{ position:absolute; border-radius:50%; filter:blur(70px); opacity:.15; }
  .orb1{ width:420px; height:420px; background:var(--gold); top:-140px; left:-110px; animation: drift1 26s ease-in-out infinite; }
  .orb2{ width:360px; height:360px; background:var(--bronze); bottom:-150px; right:-90px; animation: drift2 32s ease-in-out infinite; }
  .orb3{ width:280px; height:280px; background:var(--gold-dim); top:38%; left:58%; animation: drift3 22s ease-in-out infinite; }
  @keyframes drift1{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(70px,55px) scale(1.15);} }
  @keyframes drift2{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(-55px,-45px) scale(1.1);} }
  @keyframes drift3{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(-45px,35px) scale(1.2);} }

  /* ===================== SPLASH ===================== */
  #splash{
    position:fixed; inset:0; z-index:999;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    background: radial-gradient(circle at 50% 42%, #171310 0%, #0a0908 60%, #050403 100%);
    transition: opacity .8s ease, visibility .8s ease;
  }
  #splash.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .seal-wrap{ position:relative; width:220px; height:220px; display:flex; align-items:center; justify-content:center;}
  .seal-svg{ width:220px; height:220px; overflow:visible; }
  .seal-ring{
    fill:none; stroke:var(--gold); stroke-width:1.4; opacity:.85;
    stroke-dasharray: 700; stroke-dashoffset:700;
    animation: draw 1.8s cubic-bezier(.65,0,.35,1) forwards .15s;
  }
  .seal-ring2{
    fill:none; stroke:var(--bronze); stroke-width:.7; opacity:.6;
    stroke-dasharray: 620; stroke-dashoffset:620;
    animation: draw 1.6s cubic-bezier(.65,0,.35,1) forwards .5s;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  .splash-pulse{
    position:absolute; inset:0; margin:auto; width:220px; height:220px; border-radius:50%;
    border:1px solid var(--gold); opacity:0;
    animation: pulseRing 2.4s ease-out infinite 1.9s;
  }
  @keyframes pulseRing{ 0%{ transform:scale(.88); opacity:.55;} 100%{ transform:scale(1.55); opacity:0;} }
  .node{
    position:absolute; width:9px; height:9px; border-radius:50%;
    background:var(--gold-bright); box-shadow:0 0 10px 2px rgba(240,207,110,.6);
    opacity:0; animation: nodeIn .6s ease forwards;
  }
  .node.n1{ top:14px; left:50%; transform:translateX(-50%); animation-delay:1.5s; }
  .node.n2{ bottom:34px; left:24px; animation-delay:1.7s; }
  .node.n3{ bottom:34px; right:24px; animation-delay:1.9s; }
  @keyframes nodeIn{ from{opacity:0; transform:scale(.3);} to{opacity:1; transform:scale(1);} }
  .seal-mark{
    position:absolute; font-family:'Sora',sans-serif; font-weight:800; font-size:15px;
    letter-spacing:.12em; color:var(--gold-bright); opacity:0;
    animation: fadeUp .7s ease forwards 2.05s;
  }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .splash-title{
    margin-top:34px; font-size:clamp(1.8rem, 7vw, 2.6rem); text-align:center; opacity:0;
    animation: fadeUp .8s ease forwards 2.3s;
  }
  .splash-sub{
    margin-top:10px; font-size:.78rem; letter-spacing:.35em; text-transform:uppercase;
    color:var(--text-faint); opacity:0; animation: fadeUp .8s ease forwards 2.55s;
  }
  .splash-flash{
    position:absolute; inset:0; background:var(--gold-bright); border-radius:50%;
    opacity:0; filter:blur(30px);
    animation: flash .5s ease forwards 1.45s;
  }
  @keyframes flash{ 0%{opacity:0;} 40%{opacity:.35;} 100%{opacity:0;} }

  @media (prefers-reduced-motion: reduce){
    .seal-ring,.seal-ring2,.node,.seal-mark,.splash-title,.splash-sub{ animation:none !important; opacity:1 !important; stroke-dashoffset:0 !important; }
    .splash-flash,.splash-pulse{ animation:none !important; opacity:0 !important; }
    .gold-text,.bg-orb,.brand-mark{ animation:none !important; }
    .portal-card{ animation:none !important; opacity:1 !important; }
  }

  /* ===================== TOPBAR ===================== */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px; border-bottom:1px solid var(--border);
    background:rgba(10,9,8,.7); backdrop-filter:blur(10px);
    position:sticky; top:0; z-index:50;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-family:'Sora',sans-serif; font-weight:800; font-size:1.05rem; letter-spacing:-0.01em;}
  .brand-mark{
    width:30px; height:30px; border-radius:50%; border:1.4px solid var(--gold);
    display:flex; align-items:center; justify-content:center; font-size:.65rem; color:var(--gold-bright);
    animation: markPulse 3s ease-in-out infinite;
  }
  @keyframes markPulse{
    0%,100%{ box-shadow: inset 0 0 8px rgba(212,175,55,.25), 0 0 0 rgba(212,175,55,0);}
    50%{ box-shadow: inset 0 0 8px rgba(212,175,55,.4), 0 0 10px rgba(212,175,55,.35);}
  }
  .topbar-right{ display:flex; align-items:center; gap:14px; }
  .role-chip{
    font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-bright);
    border:1px solid var(--border-bright); padding:5px 12px; border-radius:999px; background:var(--surface);
  }
  .user-name{ font-size:.85rem; color:var(--text-dim); }
  .btn-logout{
    background:transparent; border:1px solid var(--border-bright); color:var(--text-dim);
    padding:7px 14px; border-radius:8px; font-size:.8rem; transition:.2s;
  }
  .btn-logout:hover{ border-color:var(--gold); color:var(--gold-bright); }
  .btn-logout:active{ transform:scale(.96); }

  /* ===================== PORTAL SELECT ===================== */
  .center-stage{ flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .portal-hero{ text-align:center; max-width:760px; margin:0 auto 44px; }
  .eyebrow{ font-size:.72rem; letter-spacing:.35em; text-transform:uppercase; color:var(--gold-dim); margin-bottom:14px; }
  .portal-hero h1{ font-size:clamp(1.8rem, 4.6vw, 2.6rem); margin-bottom:14px; }
  .portal-hero p{ color:var(--text-dim); font-size:1rem; line-height:1.6; }
  .portal-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; max-width:920px; width:100%; margin:0 auto; }
  @media(max-width:820px){ .portal-grid{ grid-template-columns:1fr; } }
  .portal-card{
    background:linear-gradient(160deg, var(--surface), var(--surface-2));
    border:1px solid var(--border); border-radius:var(--radius); padding:30px 24px;
    text-align:left; transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    position:relative; overflow:hidden; opacity:0; animation: cardFadeIn .5s ease forwards;
  }
  .portal-card:nth-child(1){ animation-delay:.08s; }
  .portal-card:nth-child(2){ animation-delay:.18s; }
  .portal-card:nth-child(3){ animation-delay:.28s; }
  @keyframes cardFadeIn{ to{ opacity:1; } }
  .portal-card:hover{ transform:translateY(-4px); border-color:var(--gold-dim); box-shadow:var(--shadow-gold); }
  .portal-card:active{ transform:translateY(-1px) scale(.99); }
  .portal-icon{
    width:46px; height:46px; border-radius:50%; border:1px solid var(--border-bright);
    display:flex; align-items:center; justify-content:center; font-size:1.3rem; margin-bottom:18px; color:var(--gold-bright);
  }
  .portal-card h3{ font-size:1.15rem; margin-bottom:8px; }
  .portal-card p{ color:var(--text-dim); font-size:.85rem; line-height:1.5; margin-bottom:20px; }
  .portal-enter{
    display:inline-flex; align-items:center; gap:6px; font-size:.78rem; letter-spacing:.08em; text-transform:uppercase;
    color:var(--gold-bright); font-weight:700;
  }

  /* ===================== FORMS / LOGIN ===================== */
  .auth-card{
    background:linear-gradient(160deg, var(--surface), var(--surface-2));
    border:1px solid var(--border); border-radius:var(--radius); padding:36px 34px; width:100%; max-width:400px;
    box-shadow:var(--shadow-gold);
  }
  .auth-card h2{ font-size:1.4rem; margin-bottom:6px; }
  .auth-sub{ color:var(--text-dim); font-size:.83rem; margin-bottom:24px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin-bottom:7px; }
  .field input, .field select, .field textarea{
    width:100%; background:var(--bg-alt); border:1px solid var(--border-bright); color:var(--text);
    padding:11px 13px; border-radius:8px; font-size:.9rem; transition:.2s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--gold); }
  .field textarea{ resize:vertical; min-height:80px; }
  .hint{ font-size:.72rem; color:var(--text-faint); margin-top:6px; }
  .err-msg{ color:var(--danger); font-size:.8rem; margin-top:10px; min-height:1em; }
  .ok-msg{ color:var(--success); font-size:.8rem; margin-top:10px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(135deg, var(--gold-dim), var(--gold));
    color:#191307; font-weight:700; border:none; padding:12px 20px; border-radius:9px;
    font-size:.86rem; letter-spacing:.03em; width:100%; transition:filter .2s, transform .2s;
  }
  .btn:hover{ filter:brightness(1.1); transform:translateY(-1px); }
  .btn:active{ transform:scale(.97); }
  .btn-outline{
    background:transparent; border:1px solid var(--border-bright); color:var(--text-dim); width:auto;
  }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold-bright); }
  .btn-outline:active{ transform:scale(.96); }
  .btn-sm{ padding:8px 14px; font-size:.78rem; width:auto; }
  .btn-danger{ background:linear-gradient(135deg,#7a2d27,#a5372c); color:#fdeceb; }
  .back-link{
    display:inline-flex; align-items:center; gap:6px; color:var(--text-faint); font-size:.82rem;
    margin-bottom:22px; transition:.2s; background:none; border:none;
  }
  .back-link:hover{ color:var(--gold-bright); }

  /* ===================== DASHBOARD LAYOUT ===================== */
  .dash-wrap{ display:flex; flex:1; min-height:0; }
  .sidebar{
    width:230px; border-right:1px solid var(--border); padding:22px 14px; flex-shrink:0;
    background:var(--bg-alt);
  }
  .sidebar-title{ font-size:.68rem; letter-spacing:.15em; text-transform:uppercase; color:var(--text-faint); padding:0 10px 10px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; margin-bottom:3px;
    color:var(--text-dim); font-size:.86rem; background:none; border:none; width:100%; text-align:left; transition:.15s;
  }
  .nav-item:hover{ background:var(--surface-2); color:var(--text); }
  .nav-item.active{ background:var(--surface-2); color:var(--gold-bright); border:1px solid var(--border-bright); }
  .nav-item:active{ transform:scale(.98); }
  .main-content{ flex:1; padding:30px 34px; overflow-y:auto; max-width:1500px; margin:0 auto; width:100%; }
  .content-head{ margin-bottom:24px; }
  .content-head h2{ font-size:1.5rem; margin-bottom:4px; }
  .content-head p{ color:var(--text-dim); font-size:.86rem; }

  @media(max-width:860px){
    .dash-wrap{ flex-direction:column; }
    .sidebar{ width:100%; display:flex; overflow-x:auto; gap:4px; padding:12px; border-right:none; border-bottom:1px solid var(--border); }
    .sidebar-title{ display:none; }
    .nav-item{ white-space:nowrap; width:auto; padding:11px 14px; }
    .main-content{ padding:22px 18px; }
  }
  @media(max-width:480px){
    .seal-wrap,.seal-svg,.splash-pulse{ width:170px; height:170px; }
    .auth-card{ padding:26px 20px; }
    .portal-card{ padding:24px 18px; }
    .main-content{ padding:18px 14px; }
    .topbar{ padding:12px 16px; flex-wrap:wrap; gap:8px; }
    .center-stage{ padding:28px 16px; }
  }

  .card{
    background:linear-gradient(160deg, var(--surface), var(--surface-2));
    border:1px solid var(--border); border-radius:var(--radius); padding:22px; overflow-x:auto;
  }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  @media(max-width:760px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }

  .stat-card{ padding:20px; }
  .stat-num{ font-family:'Sora',sans-serif; font-weight:800; font-size:clamp(1.6rem,4vw,2.1rem); color:var(--gold-bright); }
  .stat-label{ font-size:.78rem; color:var(--text-dim); margin-top:4px; }

  table{ width:100%; border-collapse:collapse; font-size:.85rem; }
  th{ text-align:left; color:var(--text-faint); font-weight:600; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; padding:10px 12px; border-bottom:1px solid var(--border-bright); }
  td{ padding:10px 12px; border-bottom:1px solid var(--border); color:var(--text-dim); transition:background .15s; }
  tr:last-child td{ border-bottom:none; }
  tr:hover td{ background: rgba(212,175,55,.05); }
  .mono{ font-family:'JetBrains Mono',monospace; letter-spacing:.02em; }

  .badge{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:.7rem; letter-spacing:.04em; text-transform:uppercase; font-weight:600; }
  .badge-present{ background:rgba(127,191,143,.15); color:var(--success); }
  .badge-absent{ background:rgba(226,87,76,.15); color:var(--danger); }
  .badge-late{ background:rgba(226,166,60,.15); color:var(--warning); }
  .badge-pending{ background:rgba(212,175,55,.15); color:var(--gold-bright); }
  .badge-approved{ background:rgba(127,191,143,.15); color:var(--success); }
  .badge-rejected{ background:rgba(226,87,76,.15); color:var(--danger); }

  .empty-state{ text-align:center; padding:40px 20px; color:var(--text-faint); font-size:.86rem; }
  .list-item{ padding:14px 0; border-bottom:1px solid var(--border); }
  .list-item:last-child{ border-bottom:none; }
  .list-item-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; gap:10px; flex-wrap:wrap; }
  .list-item-title{ font-weight:700; font-size:.9rem; }
  .list-item-meta{ font-size:.75rem; color:var(--text-faint); }
  .list-item-body{ font-size:.85rem; color:var(--text-dim); line-height:1.5; }
  .action-row{ display:flex; gap:8px; margin-top:10px; }

  .section-label{ font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-dim); margin-bottom:12px; }
  .toast{
    position:fixed; bottom:24px; right:24px; background:var(--surface-3); border:1px solid var(--gold-dim);
    padding:13px 20px; border-radius:10px; font-size:.85rem; color:var(--gold-bright); z-index:200;
    box-shadow:var(--shadow-gold); animation: toastIn .3s ease, toastOut .3s ease 2.4s forwards;
  }
  @keyframes toastIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes toastOut{ to{opacity:0; transform:translateY(10px);} }

  .fade-in{ animation: fadeIn .4s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(10px) scale(.99);} to{opacity:1; transform:translateY(0) scale(1);} }

  .tt-table{ width:100%; border-collapse:collapse; font-size:.8rem; }
  .tt-table th, .tt-table td{ border:1px solid var(--border); padding:8px; text-align:center; }
  .tt-table th{ background:var(--surface-2); }
  .tt-table input{ width:100%; background:transparent; border:none; color:var(--text); text-align:center; font-size:.78rem; }
  .tt-table input:focus{ outline:1px solid var(--gold); border-radius:4px; }

  .bar-chart{ display:flex; align-items:flex-end; gap:10px; height:160px; padding-top:10px; }
  .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .bar{ width:100%; max-width:34px; background:linear-gradient(180deg, var(--gold-bright), var(--gold-dim)); border-radius:5px 5px 0 0; transition:height .5s ease; }
  .bar-val{ font-size:.68rem; color:var(--text-faint); margin-bottom:4px; }
  .bar-lbl{ font-size:.66rem; color:var(--text-faint); margin-top:8px; text-align:center; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(5,4,3,.7); backdrop-filter:blur(3px); z-index:150; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal{ background:var(--surface-2); border:1px solid var(--border-bright); border-radius:var(--radius); padding:26px; max-width:440px; width:100%; box-shadow:var(--shadow-gold); }

  .pill-tabs{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .pill-tab{ padding:7px 15px; border-radius:999px; border:1px solid var(--border-bright); background:var(--surface); color:var(--text-dim); font-size:.78rem; }
  .pill-tab.active{ background:var(--surface-3); color:var(--gold-bright); border-color:var(--gold-dim); }

  .footer-note{ text-align:center; padding:16px; font-size:.72rem; color:var(--text-faint); border-top:1px solid var(--border); }
</style>
</head>
<body>

<div class="bg-fx" aria-hidden="true">
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>
</div>

<div id="splash">
  <div class="splash-flash"></div>
  <div class="seal-wrap">
    <div class="splash-pulse"></div>
    <svg class="seal-svg" viewBox="0 0 220 220">
      <circle class="seal-ring" cx="110" cy="110" r="92"></circle>
      <circle class="seal-ring2" cx="110" cy="110" r="76"></circle>
    </svg>
    <div class="node n1"></div>
    <div class="node n2"></div>
    <div class="node n3"></div>
    <div class="seal-mark">SYNC</div>
  </div>
  <div class="splash-title gold-text display">EduSync AI</div>
  <div class="splash-sub">Attendance &middot; Records &middot; One Circle</div>
</div>

<div id="app"></div>

<script>
/* ============================================================
   EDUSYNC AI — school management prototype
   Data persists via window.storage (shared across all users of
   this artifact link). This is a functional demo, not a
   production system — see in-app notes on login screens.
============================================================ */

function classSort(a,b){ return String(a).localeCompare(String(b), undefined, {numeric:true, sensitivity:'base'}); }
function getClassList(){ return (db && Array.isArray(db.classes) ? db.classes : []).slice().sort(classSort); }
function normalizeClassName(targetDb, name){
  const clean = String(name||'').trim();
  if(!clean) return clean;
  const existing = (targetDb.classes||[]).find(c=>c.toLowerCase()===clean.toLowerCase());
  return existing || clean;
}
function registerClass(targetDb, name){
  const clean = String(name||'').trim();
  if(!clean) return;
  if(!Array.isArray(targetDb.classes)) targetDb.classes = [];
  if(!targetDb.classes.some(c=>c.toLowerCase()===clean.toLowerCase())) targetDb.classes.push(clean);
}
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat"];
const PERIODS = [1,2,3,4,5,6,7];

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadDB(){
  try{
    const res = await window.storage.get('eduSync-db', true);
    db = res && res.value ? JSON.parse(res.value) : defaultDB();
  }catch(e){
    db = defaultDB();
  }
  let migrated = false;
  if(!Array.isArray(db.classes)){
    const set = new Set();
    (db.students||[]).forEach(s=>{ if(s.class) set.add(s.class); });
    (db.teachers||[]).forEach(t=>{ (t.classes||[]).forEach(c=>set.add(c)); });
    db.classes = Array.from(set);
    migrated = true;
  }
  // One-time upgrade from the old placeholder classes (9B/10A) to the
  // school's real 11th-grade structure. Only fires if those legacy names
  // are still present, so it never overwrites real admin-entered classes.
  if(db._seedVersion !== 2){
    const legacy = new Set(["9b","10a"]);
    const looksLegacy = db.classes.some(c=>legacy.has(String(c).toLowerCase()));
    if(looksLegacy){
      db.classes = SCHOOL_CLASSES.slice();
      db.students = (db.students||[]).map(s=>{
        const c = String(s.class||'').toLowerCase();
        if(c==='10a') return Object.assign({}, s, {class:"11th Commerce"});
        if(c==='9b') return Object.assign({}, s, {class:"11th Science A"});
        return s;
      });
      db.teachers = (db.teachers||[]).map(t=>Object.assign({}, t, {
        classes: (t.classes||[]).filter(c=>!legacy.has(String(c).toLowerCase()))
      }));
      if(!db.timetable) db.timetable = {};
      if(!db.timetable["11th Commerce"]) db.timetable["11th Commerce"] = Object.assign({}, XI_COMMERCE_TIMETABLE);
      migrated = true;
    }
    db._seedVersion = 2;
    migrated = true;
  }
  if(migrated){ try{ await saveDB(); }catch(e){} }
}
async function saveDB(){
  try{
    await window.storage.set('eduSync-db', JSON.stringify(db), true);
  }catch(e){ console.error('Storage save failed', e); showToast('Could not save — try again', true); }
}
async function mutate(fn){
  fn(db);
  await saveDB();
  render();
}

function showToast(msg, isErr){
  const el = document.createElement('div');
  el.className='toast';
  if(isErr) el.style.borderColor = 'var(--danger)';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2700);
}

function go(view, patch){ state = Object.assign(state, {view}, patch||{}); render(); window.scrollTo(0,0); }

function doLogin(){
  const role = state.role;
  const err = document.getElementById('login-err');
  if(role==='student'){
    const name = document.getElementById('f-name').value.trim();
    const adm = document.getElementById('f-adm').value.trim().toUpperCase();
    if(!name || !adm){ err.textContent = 'Please fill in both fields.'; return; }
    const stu = db.students.find(s=>s.admissionNumber.toUpperCase()===adm);
    if(!stu){ err.textContent = 'Admission number not found. Check with your school office.'; return; }
    state.sub = { admissionNumber: stu.admissionNumber, name: stu.name, class: stu.class, loginNameEntered:name };
    go('dashboard', {tab:'overview'});
  } else if(role==='teacher'){
    const name = document.getElementById('f-name').value.trim();
    const code = document.getElementById('f-code').value.trim().toUpperCase();
    if(!name || !code){ err.textContent = 'Please fill in both fields.'; return; }
    const t = db.teachers.find(x=>x.code.toUpperCase()===code);
    if(!t){ err.textContent = 'Invalid teacher code.'; return; }
    state.sub = { name: t.name, code:t.code, classes:t.classes||[] };
    go('dashboard', {tab:'attendance'});
  } else {
    const name = document.getElementById('f-name').value.trim();
    const pass = document.getElementById('f-pass').value.trim();
    if(!name || !pass){ err.textContent = 'Please fill in both fields.'; return; }
    const a = db.admins.find(x=>x.passcode===pass);
    if(!a){ err.textContent = 'Invalid passcode.'; return; }
    state.sub = { name: name || a.name };
    go('dashboard', {tab:'overview'});
  }
}

/* ===================== SHARED WIDGETS ===================== */
function attendanceBadge(status){
  if(status==='present') return `<span class="badge badge-present">Present</span>`;
  if(status==='absent') return `<span class="badge badge-absent">Absent</span>`;
  if(status==='late') return `<span class="badge badge-late">Late</span>`;
  return '';
}
function leaveBadge(status){
  if(status==='pending') return `<span class="badge badge-pending">Pending</span>`;
  if(status==='approved') return `<span class="badge badge-approved">Approved</span>`;
  return `<span class="badge badge-rejected">Rejected</span>`;
}

function renderBarChart(dataPairs, maxHintLabel){
  const max = Math.max(1, ...dataPairs.map(d=>d[1]));
  return `<div class="bar-chart">
    ${dataPairs.map(([lbl,val])=>`
      <div class="bar-col">
        <div class="bar-val">${val}</div>
        <div class="bar" style="height:${val===0?2:Math.max(6,(val/max)*130)}px;"></div>
        <div class="bar-lbl">${esc(lbl)}</div>
      </div>`).join('')}
  </div>`;
}

function renderAnalytics(scopeClasses){
  if(!scopeClasses.length){
    return `<div class="content-head"><h2>Attendance Analytics</h2><p>Late-coming trends by class and month.</p></div>
    <div class="card"><div class="empty-state">No classes yet — analytics will appear once students are added.</div></div>`;
  }
  const now = new Date();
  const months = [];
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push(d.toISOString().slice(0,7));
  }
  const lateByClass = scopeClasses.map(c=>[c, db.attendance.filter(a=>a.class===c && a.status==='late').length]);
  const lateByMonth = months.map(m=>[m.slice(5)+'/'+m.slice(2,4), db.attendance.filter(a=>a.status==='late' && a.date.startsWith(m) && scopeClasses.includes(a.class)).length]);
  const totalLate = db.attendance.filter(a=>a.status==='late' && scopeClasses.includes(a.class)).length;
  const totalRecords = db.attendance.filter(a=>scopeClasses.includes(a.class)).length;
  return `
  <div class="content-head"><h2>Attendance Analytics</h2><p>Late-coming trends by class and month.</p></div>
  <div class="grid-2" style="margin-bottom:18px;">
    <div class="card stat-card"><div class="stat-num">${totalLate}</div><div class="stat-label">Total late marks</div></div>
    <div class="card stat-card"><div class="stat-num">${totalRecords? Math.round((totalLate/totalRecords)*100):0}%</div><div class="stat-label">Of all attendance records</div></div>
  </div>
  <div class="card" style="margin-bottom:18px;">
    <div class="section-label">Late Arrivals by Class</div>
    ${lateByClass.some(x=>x[1]>0) ? renderBarChart(lateByClass) : `<div class="empty-state">No late records yet — mark attendance to populate this chart.</div>`}
  </div>
  <div class="card">
    <div class="section-label">Late Arrivals — Last 6 Months</div>
    ${lateByMonth.some(x=>x[1]>0) ? renderBarChart(lateByMonth) : `<div class="empty-state">No late records yet this period.</div>`}
  </div>`;
}

  const list = db.teachers.slice();
  return `
  <div class="content-head"><h2>Manage Teachers</h2><p>Issue login codes for teacher accounts.</p></div>
  <div class="grid-2">
    <div class="card">
      <div class="section-label">Add Teacher</div>
      <div class="field"><label>Full Name</label><input id="t-name" placeholder="Teacher name"></div>
      <div class="field"><label>Teacher Code</label><input id="t-code" class="mono" placeholder="e.g. TCH-3305" style="text-transform:uppercase;"></div>
      <div class="field"><label>Classes (comma-separated, optional)</label><input id="t-classes" placeholder="e.g. 11th Commerce, 11th Science A"></div>
      <button class="btn" id="t-submit">Add Teacher</button>
      <div class="err-msg" id="t-err"></div>
    </div>
    <div class="card">
      <div class="section-label">All Teachers (${list.length})</div>
      ${list.length? `<table><tr><th>Name</th><th>Code</th><th>Classes</th><th></th></tr>
        ${list.map(t=>`<tr><td>${esc(t.name)}</td><td class="mono">${esc(t.code)}</td><td>${esc((t.classes||[]).join(', ')||'All')}</td>
        <td><button class="btn-outline btn-sm" data-del-teacher="${esc(t.code)}">Remove</button></td></tr>`).join('')}
      </table>` : `<div class="empty-state">No teachers added yet.</div>`}
    </div>
  </div>`;
}

/* ===================== MODAL (unused placeholder for future) ===================== */
function renderModal(){ return ''; }

/* ===================== EVENT BINDING ===================== */
function bindEvents(){
  // portal select
  document.querySelectorAll('.portal-card').forEach(el=>{
    el.addEventListener('click', ()=>{ go('login', {role: el.dataset.role, sub:null}); });
  });
  const backBtn = document.getElementById('back-btn');
  if(backBtn) backBtn.addEventListener('click', ()=>go('portalSelect'));

  const loginBtn = document.getElementById('login-submit');
  if(loginBtn) loginBtn.addEventListener('click', doLogin);
  ['f-name','f-adm','f-code','f-pass'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  });

  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn) logoutBtn.addEventListener('click', ()=>{ state = { view:'portalSelect', role:null, sub:null, tab:'overview', selectedClass:null, modal:null }; render(); });

  document.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{ state.tab = el.dataset.tab; render(); });
  });

  // leave type toggle
  const lvType = document.getElementById('lv-type');
  if(lvType){
    const toggle = ()=>{ document.getElementById('lv-doc-wrap').style.display = lvType.value==='sick' ? 'block':'none'; };
    lvType.addEventListener('change', toggle); toggle();
  }
  const lvSubmit = document.getElementById('lv-submit');
  if(lvSubmit) lvSubmit.addEventListener('click', async ()=>{
    const type = document.getElementById('lv-type').value;
    const reason = document.getElementById('lv-reason').value.trim();
    const doc = type==='sick' ? document.getElementById('lv-doc').value.trim() : '';
    if(!reason){ showToast('Please enter a reason', true); return; }
    if(type==='sick' && !doc){ showToast('Please add a medical receipt / prescription note', true); return; }
    await mutate(d=>{
      d.leaves.push({ id:uid(), admissionNumber: state.sub.admissionNumber, type, reason, doc, status:'pending', date: todayStr() });
    });
    showToast('Leave request submitted');
  });

  const cxSubmit = document.getElementById('cx-submit');
  if(cxSubmit) cxSubmit.addEventListener('click', async ()=>{
    const category = document.getElementById('cx-cat').value;
    const text = document.getElementById('cx-text').value.trim();
    if(!text){ showToast('Please describe your complaint', true); return; }
    await mutate(d=>{
      d.complaints.push({ id:uid(), source:'student', byAdm: state.sub.admissionNumber, category, text, date: todayStr() });
    });
    showToast('Complaint submitted');
  });

  const tcxSubmit = document.getElementById('tcx-submit');
  if(tcxSubmit) tcxSubmit.addEventListener('click', async ()=>{
    const adm = document.getElementById('tcx-adm').value.trim().toUpperCase();
    const category = document.getElementById('tcx-cat').value;
    const text = document.getElementById('tcx-text').value.trim();
    const errEl = document.getElementById('tcx-err');
    if(!adm || !text){ errEl.textContent = 'Please fill in all fields.'; return; }
    const stu = db.students.find(s=>s.admissionNumber.toUpperCase()===adm);
    if(!stu){ errEl.textContent = 'No student found with that admission number.'; return; }
    errEl.textContent='';
    await mutate(d=>{
      d.complaints.push({ id:uid(), source:'teacher', byName: state.sub.name, aboutAdm: stu.admissionNumber, category, text, date: todayStr() });
    });
    showToast('Complaint filed');
  });

  document.querySelectorAll('[data-leave-approve]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.dataset.leaveApprove;
      await mutate(d=>{ const l = d.leaves.find(x=>x.id===id); if(l){ l.status='approved'; l.respondedBy=state.sub.name; } });
      showToast('Leave approved');
    });
  });
  document.querySelectorAll('[data-leave-reject]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.dataset.leaveReject;
      await mutate(d=>{ const l = d.leaves.find(x=>x.id===id); if(l){ l.status='rejected'; l.respondedBy=state.sub.name; } });
      showToast('Leave rejected');
    });
  });

  // remarks
  const rmSubmit = document.getElementById('rm-submit');
  if(rmSubmit) rmSubmit.addEventListener('click', async ()=>{
    const adm = document.getElementById('rm-adm').value.trim().toUpperCase();
    const name = document.getElementById('rm-name').value.trim();
    const text = document.getElementById('rm-text').value.trim();
    const errEl = document.getElementById('rm-err');
    if(!adm || !name || !text){ errEl.textContent = 'Please fill in all fields.'; return; }
    const stu = db.students.find(s=>s.admissionNumber.toUpperCase()===adm);
    if(!stu){ errEl.textContent = 'No student found with that admission number.'; return; }
    errEl.textContent='';
    await mutate(d=>{
      d.remarks.push({ id:uid(), admissionNumber: stu.admissionNumber, text, by: state.sub.name, date: todayStr() });
    });
    showToast('Remark posted');
  });

  // attendance
  const attClassSel = document.getElementById('att-class');
  if(attClassSel) attClassSel.addEventListener('change', ()=>{ state.selectedClass = attClassSel.value; render(); });
  const attDateInput = document.getElementById('att-date');
  if(attDateInput) attDateInput.addEventListener('change', ()=>{ state._attDate = attDateInput.value; render(); });
  const attSave = document.getElementById('att-save');
  if(attSave) attSave.addEventListener('click', async ()=>{
    const cls = document.getElementById('att-class').value;
    const dateVal = document.getElementById('att-date').value || todayStr();
    const selects = document.querySelectorAll('.att-status-select');
    const marks = [];
    selects.forEach(s=> marks.push({adm:s.dataset.attAdm, status:s.value}));
    await mutate(d=>{
      marks.forEach(m=>{
        const existing = d.attendance.find(a=>a.admissionNumber===m.adm && a.date===dateVal && a.class===cls);
        if(existing){ existing.status = m.status; existing.markedBy = state.sub.name; }
        else d.attendance.push({ admissionNumber:m.adm, date:dateVal, class:cls, status:m.status, markedBy: state.sub.name });
      });
    });
    showToast('Attendance saved');
  });

  // timetable
  const ttClassSelect = document.getElementById('tt-class-select');
  if(ttClassSelect) ttClassSelect.addEventListener('change', ()=>{ state.selectedClass = ttClassSelect.value; render(); });
  const ttSave = document.getElementById('tt-save');
  if(ttSave) ttSave.addEventListener('click', async ()=>{
    const cls = state.selectedClass || getClassList()[0];
    const inputs = document.querySelectorAll('[data-tt-key]');
    const entries = {};
    inputs.forEach(i=> entries[i.dataset.ttKey] = i.value.trim());
    await mutate(d=>{ d.timetable[cls] = entries; });
    showToast('Timetable saved for '+cls);
  });

  // homework
  const hwSubmit = document.getElementById('hw-submit');
  if(hwSubmit) hwSubmit.addEventListener('click', async ()=>{
    const cls = document.getElementById('hw-class').value;
    const subject = document.getElementById('hw-subject').value.trim();
    const text = document.getElementById('hw-text').value.trim();
    const due = document.getElementById('hw-due').value || todayStr();
    if(!subject || !text){ showToast('Please fill in subject and details', true); return; }
    await mutate(d=>{ d.homework.push({ id:uid(), class:cls, subject, text, dueDate:due, by: state.sub.name, date: todayStr() }); });
    showToast('Homework posted');
  });

  // syllabus
  const sylSubmit = document.getElementById('syl-submit');
  if(sylSubmit) sylSubmit.addEventListener('click', async ()=>{
    const examName = document.getElementById('syl-exam').value.trim();
    const subject = document.getElementById('syl-subject').value.trim();
    const content = document.getElementById('syl-content').value.trim();
    if(!examName || !subject || !content){ showToast('Please fill in all fields', true); return; }
    await mutate(d=>{ d.syllabus.push({ id:uid(), examName, subject, content, by: state.sub.name, date: todayStr() }); });
    showToast('Syllabus posted');
  });

  // announcements
  const anSubmit = document.getElementById('an-submit');
  if(anSubmit) anSubmit.addEventListener('click', async ()=>{
    const title = document.getElementById('an-title').value.trim();
    const text = document.getElementById('an-text').value.trim();
    if(!title || !text){ showToast('Please fill in all fields', true); return; }
    await mutate(d=>{ d.announcements.push({ id:uid(), title, text, by: state.sub.name, date: todayStr() }); });
    showToast('Announcement posted');
  });

  // student manager
  const stuSubmit = document.getElementById('stu-submit');
  if(stuSubmit) stuSubmit.addEventListener('click', async ()=>{
    const adm = document.getElementById('stu-adm').value.trim().toUpperCase();
    const name = document.getElementById('stu-name').value.trim();
    const cls = document.getElementById('stu-class').value.trim();
    const errEl = document.getElementById('stu-err');
    if(!adm || !name || !cls){ errEl.textContent = 'Please fill in all fields.'; return; }
    if(!/^M0/.test(adm)){ errEl.textContent = 'Admission number must start with M0 (e.g. M01004).'; return; }
    if(db.students.some(s=>s.admissionNumber.toUpperCase()===adm)){ errEl.textContent = 'This admission number already exists.'; return; }
    errEl.textContent='';
    await mutate(d=>{
      const clsFinal = normalizeClassName(d, cls);
      d.students.push({ admissionNumber: adm, name, class: clsFinal });
      registerClass(d, clsFinal);
    });
    showToast('Student added');
  });
  document.querySelectorAll('[data-del-student]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const adm = el.dataset.delStudent;
      await mutate(d=>{ d.students = d.students.filter(s=>s.admissionNumber!==adm); });
      showToast('Student removed');
    });
  });

  // teacher manager
  const tSubmit = document.getElementById('t-submit');
  if(tSubmit) tSubmit.addEventListener('click', async ()=>{
    const name = document.getElementById('t-name').value.trim();
    const code = document.getElementById('t-code').value.trim().toUpperCase();
    const classesRaw = document.getElementById('t-classes').value.trim();
    const classes = classesRaw ? classesRaw.split(',').map(c=>c.trim()).filter(Boolean) : [];
    const errEl = document.getElementById('t-err');
    if(!name || !code){ errEl.textContent = 'Please fill in name and code.'; return; }
    if(db.teachers.some(t=>t.code.toUpperCase()===code)){ errEl.textContent = 'This teacher code already exists.'; return; }
    errEl.textContent='';
    await mutate(d=>{
      const normClasses = classes.map(c=>normalizeClassName(d,c));
      d.teachers.push({ name, code, classes: normClasses });
      normClasses.forEach(c=>registerClass(d,c));
    });
    showToast('Teacher added');
  });
  document.querySelectorAll('[data-del-teacher]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const code = el.dataset.delTeacher;
      await mutate(d=>{ d.teachers = d.teachers.filter(t=>t.code!==code); });
      showToast('Teacher removed');
    });
  });
}

/* ===================== BOOT ===================== */
(async function boot(){
  await loadDB();
  render();
  setTimeout(()=>{ document.getElementById('splash').classList.add('hide'); }, 3100);
})();
</script>
</body>
</html>
