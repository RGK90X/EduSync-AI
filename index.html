<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduSync AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;
  --bg-alt:#F3F7FC;
  --surface:#FFFFFF;
  --surface-2:#EEF3FA;
  --surface-3:#E3ECF8;
  --border:#D7E2F0;
  --border-bright:#AFC4E0;
  --navy:#1E3A5F;
  --navy-bright:#2F6FE0;
  --navy-dim:#0F2745;
  --text:#0A0A0A;
  --text-dim:#0A0A0A;
  --text-faint:#0A0A0A;
  --danger:#C62828;
  --success:#1E7B34;
  --warning:#B26A00;
  --radius:14px;
  --shadow: 0 0 0 1px rgba(30,58,95,.15), 0 8px 24px rgba(30,58,95,.12);
  --ease: cubic-bezier(.4,0,.2,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
html{ scroll-behavior:smooth; }
body{
  background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; font-weight:700;
  min-height:100vh; -webkit-font-smoothing:antialiased;
  opacity:0; animation: bodyIn .5s var(--ease) forwards;
}
@keyframes bodyIn{ from{opacity:0;} to{opacity:1;} }
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  *, *::before, *::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}

/* Smooth, consistent motion on every interactive element */
button, a, input, select, textarea, .nav-item, .portal-card, .card, .badge, .brand-mark{
  transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease),
              background-color .2s var(--ease), color .2s var(--ease), filter .2s var(--ease), opacity .2s var(--ease);
}
button:active, .nav-item:active{ transform:scale(.96); }
.field input:focus, .field select:focus, .field textarea:focus{ box-shadow:0 0 0 3px rgba(47,111,224,.15); }
#app{min-height:100vh; display:flex; flex-direction:column;}
a{color:inherit;}
button{font-family:inherit; font-weight:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-weight:inherit;}
h1,h2,h3,.display{ font-family:'Sora',sans-serif; letter-spacing:-0.01em; font-weight:800; }
:focus-visible{ outline:2px solid var(--navy-bright); outline-offset:2px; border-radius:4px;}

.topbar{
  display:flex; align-items:center; justify-content:space-between; padding:16px 28px;
  border-bottom:1px solid var(--border); background:rgba(255,255,255,.9); backdrop-filter:blur(10px);
  position:sticky; top:0; z-index:50;
}
.brand{ display:flex; align-items:center; gap:10px; font-family:'Sora',sans-serif; font-weight:800; font-size:1.05rem;}
.brand-mark{
  width:30px; height:30px; border-radius:50%; background:var(--navy); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:.65rem; font-weight:800;
  animation: markPulse 3s ease-in-out infinite;
}
@keyframes markPulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(30,58,95,.35); }
  50%{ box-shadow:0 0 0 6px rgba(30,58,95,0); }
}
.topbar-right{ display:flex; align-items:center; gap:14px; }
.role-chip{ font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; border:1px solid var(--border-bright); padding:5px 12px; border-radius:999px; background:var(--surface); }
.user-name{ font-size:.85rem; }
.btn-logout{ background:transparent; border:1px solid var(--border-bright); color:var(--text); padding:7px 14px; border-radius:8px; font-size:.8rem; }
.btn-logout:hover{ border-color:var(--navy); }

.center-stage{ flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
.portal-hero{ text-align:center; max-width:760px; margin:0 auto 44px; }
.eyebrow{ font-size:.72rem; letter-spacing:.35em; text-transform:uppercase; margin-bottom:14px; }
.portal-hero h1{ font-size:clamp(1.8rem, 4.6vw, 2.6rem); margin-bottom:14px; }
.portal-hero p{ font-size:1rem; line-height:1.6; }
.portal-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; max-width:920px; width:100%; margin:0 auto; }
@media(max-width:820px){ .portal-grid{ grid-template-columns:1fr; } }
.portal-card{
  background:linear-gradient(160deg, var(--surface), var(--surface-2)); border:1px solid var(--border);
  border-radius:var(--radius); padding:30px 24px; text-align:left; cursor:pointer; width:100%;
  opacity:0; animation: fadeInUp .45s var(--ease) both;
}
.portal-card:nth-of-type(1){ animation-delay:.05s; }
.portal-card:nth-of-type(2){ animation-delay:.13s; }
.portal-card:nth-of-type(3){ animation-delay:.21s; }
.portal-card:hover{ transform:translateY(-6px) scale(1.015); box-shadow:var(--shadow); border-color:var(--navy-dim); }
.portal-card:active{ transform:translateY(-2px) scale(.99); }
.portal-icon{
  width:46px; height:46px; border-radius:50%; border:1px solid var(--border-bright); display:flex; align-items:center; justify-content:center;
  font-size:1.3rem; margin-bottom:18px; color:var(--navy-bright); transition:transform .3s var(--ease-spring), background-color .2s var(--ease);
}
.portal-card:hover .portal-icon{ transform:scale(1.12) rotate(-4deg); background:var(--surface-3); }
.portal-card h3{ font-size:1.15rem; margin-bottom:8px; }
.portal-card p{ font-size:.85rem; line-height:1.5; margin-bottom:20px; }
.portal-enter{ font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; }

.auth-card{
  background:linear-gradient(160deg, var(--surface), var(--surface-2)); border:1px solid var(--border);
  border-radius:var(--radius); padding:36px 34px; width:100%; max-width:400px; box-shadow:var(--shadow);
}
.auth-card h2{ font-size:1.4rem; margin-bottom:6px; }
.auth-sub{ font-size:.83rem; margin-bottom:24px; }
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; margin-bottom:7px; }
.field input, .field select, .field textarea{
  width:100%; background:var(--bg-alt); border:1px solid var(--border-bright); color:var(--text);
  padding:11px 13px; border-radius:8px; font-size:.9rem;
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--navy); }
.field textarea{ resize:vertical; min-height:80px; }
.hint{ font-size:.72rem; margin-top:6px; }
.err-msg{ color:var(--danger); font-size:.8rem; margin-top:10px; min-height:1em; }
.ok-msg{ color:var(--success); font-size:.8rem; margin-top:10px; }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; background:linear-gradient(135deg, var(--navy-dim), var(--navy));
  color:#fff; font-weight:700; border:none; padding:12px 20px; border-radius:9px; font-size:.86rem; width:100%;
}
.btn:hover{ filter:brightness(1.15); transform:translateY(-1px); box-shadow:0 6px 16px rgba(30,58,95,.25); }
.btn:active{ transform:translateY(0) scale(.97); box-shadow:none; }
.btn-outline{ background:transparent; border:1px solid var(--border-bright); color:var(--text); width:auto; }
.btn-outline:hover{ border-color:var(--navy); transform:translateY(-1px); }
.btn-outline:active{ transform:translateY(0) scale(.96); }
.btn-sm{ padding:8px 14px; font-size:.78rem; width:auto; }
.btn-danger{ background:linear-gradient(135deg,#C62828,#E53935); color:#fff; }
.back-link{ display:inline-flex; align-items:center; gap:6px; font-size:.82rem; margin-bottom:22px; background:none; border:none; color:var(--text); }
.back-link:hover{ text-decoration:underline; transform:translateX(-2px); }

.dash-wrap{ display:flex; flex:1; min-height:0; }
.sidebar{ width:230px; border-right:1px solid var(--border); padding:22px 14px; flex-shrink:0; background:var(--bg-alt); }
.sidebar-title{ font-size:.68rem; letter-spacing:.15em; text-transform:uppercase; padding:0 10px 10px; }
.nav-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; margin-bottom:3px;
  font-size:.86rem; background:none; border:none; width:100%; text-align:left; color:var(--text);
  border:1px solid transparent;
}
.nav-item:hover{ background:var(--surface-2); transform:translateX(3px); }
.nav-item.active{ background:var(--surface-2); border-color:var(--border-bright); }
.nav-item span:first-child{ display:inline-block; transition:transform .2s var(--ease-spring); }
.nav-item:hover span:first-child{ transform:scale(1.2); }
.main-content{ flex:1; padding:30px 34px; overflow-y:auto; max-width:1500px; margin:0 auto; width:100%; }
.content-head{ margin-bottom:24px; }
.content-head h2{ font-size:1.5rem; margin-bottom:4px; }
@media(max-width:860px){
  .dash-wrap{ flex-direction:column; }
  .sidebar{ width:100%; display:flex; overflow-x:auto; gap:4px; padding:12px; border-right:none; border-bottom:1px solid var(--border); }
  .sidebar-title{ display:none; }
  .nav-item{ white-space:nowrap; width:auto; padding:11px 14px; }
  .main-content{ padding:22px 18px; }
}

.card{
  background:linear-gradient(160deg, var(--surface), var(--surface-2)); border:1px solid var(--border); border-radius:var(--radius);
  padding:22px; overflow-x:auto; opacity:0; animation: fadeInUp .4s var(--ease) both;
}
.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
@media(max-width:760px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }
.grid-2 > .card:nth-child(1), .grid-3 > .card:nth-child(1){ animation-delay:.03s; }
.grid-2 > .card:nth-child(2), .grid-3 > .card:nth-child(2){ animation-delay:.09s; }
.grid-3 > .card:nth-child(3){ animation-delay:.15s; }
.stat-card{ padding:20px; transition:transform .2s var(--ease), box-shadow .2s var(--ease); }
.stat-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow); }
.stat-num{ font-family:'Sora',sans-serif; font-weight:800; font-size:clamp(1.6rem,4vw,2.1rem); display:inline-block; }
.stat-label{ font-size:.78rem; margin-top:4px; }

table{ width:100%; border-collapse:collapse; font-size:.85rem; }
th{ text-align:left; font-weight:700; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; padding:10px 12px; border-bottom:1px solid var(--border-bright); }
td{ padding:10px 12px; border-bottom:1px solid var(--border); transition:background-color .15s var(--ease); }
tr{ opacity:0; animation: fadeIn .35s var(--ease) both; }
tr:nth-child(2){ animation-delay:.03s; } tr:nth-child(3){ animation-delay:.06s; }
tr:nth-child(4){ animation-delay:.09s; } tr:nth-child(5){ animation-delay:.12s; }
tr:nth-child(6){ animation-delay:.15s; } tr:nth-child(n+7){ animation-delay:.18s; }
tr:hover td{ background:rgba(30,58,95,.04); }
tr:last-child td{ border-bottom:none; }
.mono{ font-family:'JetBrains Mono',monospace; letter-spacing:.02em; }

.badge{
  display:inline-block; padding:3px 10px; border-radius:999px; font-size:.7rem; letter-spacing:.04em; text-transform:uppercase; font-weight:700;
  animation: popIn .3s var(--ease-spring) both;
}
@keyframes popIn{ from{ opacity:0; transform:scale(.6); } to{ opacity:1; transform:scale(1); } }
.badge-present{ background:rgba(30,123,52,.15); color:var(--success); }
.badge-absent{ background:rgba(198,40,40,.15); color:var(--danger); }
.badge-late{ background:rgba(178,106,0,.15); color:var(--warning); }
.badge-pending{ background:rgba(178,106,0,.15); color:var(--warning); }
.badge-approved{ background:rgba(30,123,52,.15); color:var(--success); }
.badge-rejected{ background:rgba(198,40,40,.15); color:var(--danger); }

.empty-state{ text-align:center; padding:40px 20px; font-size:.86rem; animation: fadeIn .4s var(--ease) both; }
.list-item{
  padding:14px 0; border-bottom:1px solid var(--border); opacity:0; animation: fadeInUp .35s var(--ease) both;
  transition:padding-left .2s var(--ease), background-color .2s var(--ease);
}
.list-item:hover{ padding-left:6px; background:rgba(30,58,95,.03); }
.list-item:nth-child(2){ animation-delay:.04s; } .list-item:nth-child(3){ animation-delay:.08s; }
.list-item:nth-child(4){ animation-delay:.12s; } .list-item:nth-child(5){ animation-delay:.16s; }
.list-item:nth-child(n+6){ animation-delay:.2s; }
.list-item:last-child{ border-bottom:none; }
.list-item-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; gap:10px; flex-wrap:wrap; }
.list-item-title{ font-weight:700; font-size:.9rem; }
.list-item-meta{ font-size:.75rem; }
.list-item-body{ font-size:.85rem; line-height:1.5; }
.action-row{ display:flex; gap:8px; margin-top:10px; }

.section-label{ font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; margin-bottom:12px; }
.toast{
  position:fixed; bottom:24px; right:24px; background:var(--surface-3); border:1px solid var(--navy-dim);
  padding:13px 20px; border-radius:10px; font-size:.85rem; z-index:200; box-shadow:var(--shadow);
  animation: toastIn .4s var(--ease-spring), toastOut .3s var(--ease) 2.4s forwards;
}
@keyframes toastIn{ from{opacity:0; transform:translateY(16px) scale(.9);} to{opacity:1; transform:translateY(0) scale(1);} }
@keyframes toastOut{ to{opacity:0; transform:translateY(10px) scale(.95);} }
.fade-in{ animation: fadeIn .35s var(--ease); }
@keyframes fadeIn{ from{opacity:0; transform:translateY(8px) scale(.99);} to{opacity:1; transform:translateY(0) scale(1);} }
@keyframes fadeInUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

.tt-table{ width:100%; border-collapse:collapse; font-size:.8rem; }
.tt-table th, .tt-table td{ border:1px solid var(--border); padding:8px; text-align:center; }
.tt-table th{ background:var(--surface-2); }
.tt-table input{ width:100%; background:transparent; border:none; color:var(--text); text-align:center; font-size:.78rem; }

.bar-chart{ display:flex; align-items:flex-end; gap:10px; height:160px; padding-top:10px; }
.bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
.bar{ width:100%; max-width:34px; background:linear-gradient(180deg, var(--navy-bright), var(--navy-dim)); border-radius:5px 5px 0 0; }
.bar-val{ font-size:.68rem; margin-bottom:4px; }
.bar-lbl{ font-size:.66rem; margin-top:8px; text-align:center; }

.occasion-icon{ display:flex; align-items:center; justify-content:center; height:100px; margin-bottom:14px; }
.occasion-name{ text-align:center; font-size:1.02rem; margin-bottom:2px; }
.occasion-date{ text-align:center; font-size:.78rem; }

.footer-note{ text-align:center; padding:16px; font-size:.72rem; border-top:1px solid var(--border); }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   EDUSYNC AI — offline single-file build.
   Everything is saved in this browser's localStorage, tied to
   this exact file. Re-opening the file (in the same browser, on
   this computer) restores everything you entered.
============================================================ */

const STORAGE_KEY = 'eduSyncAI_offline_db_v1';
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat"];
const PERIODS = [1,2,3,4,5,6,7];
const SCHOOL_CLASSES = ["11th Commerce","11th Science A","11th Science B"];

let db = null;
let state = { view:'portalSelect', role:null, sub:null, tab:'overview', selectedClass:null };

function uid(){ return Math.random().toString(36).slice(2,10); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(d){ try{ return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return d; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function classSort(a,b){ return String(a).localeCompare(String(b), undefined, {numeric:true}); }
function getClassList(){ return (db.classes||[]).slice().sort(classSort); }
function registerClass(name){
  const clean=String(name||'').trim(); if(!clean) return clean;
  if(!Array.isArray(db.classes)) db.classes=[];
  const existing = db.classes.find(c=>c.toLowerCase()===clean.toLowerCase());
  if(existing) return existing;
  db.classes.push(clean); return clean;
}

function defaultDB(){
  return {
    classes: SCHOOL_CLASSES.slice(),
    students: [], teachers: [],
    admins: [ {name:"Admin", passcode:"2026"} ],
    attendance: [], remarks: [], leaves: [], complaints: [],
    timetable: {}, homework: [], syllabus: [],
    announcements: [ {id:uid(), title:"Welcome to EduSync AI", text:"This offline portal is ready for the school expo.", date:todayStr(), by:"Admin"} ]
  };
}
function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    db = raw ? JSON.parse(raw) : defaultDB();
  }catch(e){ db = defaultDB(); }
  if(!Array.isArray(db.classes)) db.classes = SCHOOL_CLASSES.slice();
}
function saveDB(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
  catch(e){ showToast('Could not save — storage may be full.', true); }
}
function mutate(fn){ fn(db); saveDB(); render(); }

function showToast(msg, isErr){
  const el=document.createElement('div'); el.className='toast';
  if(isErr) el.style.borderColor='var(--danger)';
  el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),2700);
}
function go(view, patch){ state=Object.assign(state,{view},patch||{}); render(); window.scrollTo(0,0); }

const ICONS = { student:'&#9737;', teacher:'&#9878;', admin:'&#9819;', attendance:'&#9678;', analytics:'&#9673;',
  remarks:'&#9998;', leave:'&#9993;', complaint:'&#9873;', timetable:'&#9783;', homework:'&#128218;',
  syllabus:'&#128220;', announce:'&#128276;', overview:'&#9670;', schoolLife:'&#127884;' };

function render(){
  const app = document.getElementById('app');
  if(state.view==='portalSelect') app.innerHTML = renderPortalSelect();
  else if(state.view==='login') app.innerHTML = renderLogin();
  else if(state.view==='schoolLife') app.innerHTML = renderSchoolLife();
  else if(state.view==='dashboard') app.innerHTML = renderDashboard();
  bindEvents();
  animateStatNumbers();
}

// Counts .stat-num elements up from 0 to their target value for a bit of
// tangible motion on dashboard stats, instead of just appearing instantly.
function animateStatNumbers(){
  document.querySelectorAll('.stat-num').forEach(el=>{
    const raw = el.textContent.trim();
    const match = raw.match(/^(-?\d+)(.*)$/);
    if(!match) return;
    const target = parseInt(match[1],10), suffix = match[2] || '';
    if(target === 0){ el.textContent = '0'+suffix; return; }
    const duration = 500, start = performance.now();
    function tick(now){
      const p = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-p, 3);
      el.textContent = Math.round(target*eased) + suffix;
      if(p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

/* ===================== PORTAL SELECT ===================== */
function renderPortalSelect(){
  return `
  <div class="topbar">
    <div class="brand"><div class="brand-mark">ES</div>EduSync AI</div>
    <div style="font-size:.8rem;">School Expo Demo</div>
  </div>
  <div class="center-stage fade-in">
    <div style="width:100%;">
      <div class="portal-hero">
        <div class="eyebrow">THREE PORTALS &middot; ONE CIRCLE</div>
        <h1>Choose your portal</h1>
        <p>Attendance, remarks, leave requests, complaints, timetables and homework — all saved right here on this laptop.</p>
      </div>
      <div class="portal-grid">
        <button class="portal-card" data-role="student">
          <div class="portal-icon">${ICONS.student}</div><h3>Student</h3>
          <p>View attendance, remarks, timetable, homework and syllabus. Submit leave requests and complaints.</p>
          <span class="portal-enter">Enter &rarr;</span>
        </button>
        <button class="portal-card" data-role="teacher">
          <div class="portal-icon">${ICONS.teacher}</div><h3>Teacher</h3>
          <p>Mark attendance, give remarks, review leave requests, file complaints, manage timetable &amp; homework.</p>
          <span class="portal-enter">Enter &rarr;</span>
        </button>
        <button class="portal-card" data-role="admin">
          <div class="portal-icon">${ICONS.admin}</div><h3>Admin</h3>
          <p>Full control — manage students &amp; teacher accounts, analytics, timetable, and announcements.</p>
          <span class="portal-enter">Enter &rarr;</span>
        </button>
      </div>
    </div>
  </div>
  <div class="footer-note">EduSync AI — offline build. Data is saved only in this browser on this computer. &middot; <button class="back-link" id="school-life-link" style="display:inline;">See School Life &amp; Events &rarr;</button></div>
  `;
}

/* ===================== SCHOOL LIFE ===================== */
function occasionIcon(key){
  const icons = {
    flag:`<svg viewBox="0 0 100 100" width="80" height="80"><rect x="18" y="8" width="4" height="82" fill="#5A4A3A"/><rect x="22" y="14" width="56" height="12" fill="#FF9933"/><rect x="22" y="26" width="56" height="12" fill="#FFFFFF" stroke="#D7E2F0" stroke-width="0.5"/><rect x="22" y="38" width="56" height="12" fill="#138808"/><circle cx="50" cy="32" r="5" fill="none" stroke="#1E3A5F" stroke-width="1.6"/><circle cx="50" cy="32" r="1.3" fill="#1E3A5F"/></svg>`,

        ${fields}
        <div class="err-msg" id="login-err"></div>
        <button class="btn" id="login-submit" style="margin-top:6px;">Log In</button>
      </div>
    </div>
  </div>`;
}
function doLogin(){
  const role = state.role;
  const err = document.getElementById('login-err');
  if(role==='student'){
    const name = document.getElementById('f-name').value.trim();
    const adm = document.getElementById('f-adm').value.trim().toUpperCase();
    if(!name || !adm){ err.textContent='Please fill in both fields.'; return; }
    const stu = db.students.find(s=>s.admissionNumber.toUpperCase()===adm);
    if(!stu){ err.textContent='Admission number not found. Check with your school office.'; return; }
    state.sub = { admissionNumber: stu.admissionNumber, name: stu.name, class: stu.class };
    go('dashboard', {tab:'overview'});
  } else if(role==='teacher'){
    const name = document.getElementById('f-name').value.trim();
    const code = document.getElementById('f-code').value.trim().toUpperCase();
    if(!name || !code){ err.textContent='Please fill in both fields.'; return; }
    const t = db.teachers.find(x=>x.code.toUpperCase()===code);
    if(!t){ err.textContent='Invalid teacher code.'; return; }
    state.sub = { name: t.name, code:t.code, classes:t.classes||[] };
    go('dashboard', {tab:'attendance'});
  } else {
    const name = document.getElementById('f-name').value.trim();
    const pass = document.getElementById('f-pass').value.trim();
    if(!name || !pass){ err.textContent='Please fill in both fields.'; return; }
    const a = db.admins.find(x=>x.passcode===pass);
    if(!a){ err.textContent='Invalid passcode.'; return; }
    state.sub = { name: name || a.name };
    go('dashboard', {tab:'overview'});
  }
}

/* ===================== SHARED WIDGETS ===================== */
function attendanceBadge(status){
  if(status==='present') return `<span class="badge badge-present">Present</span>`;
  if(status==='absent') return `<span class="badge badge-absent">Absent</span>`;
  if(status==='late') return `<span class="badge badge-late">Late</span>`;
  return '';
}
function leaveBadge(status){
  if(status==='pending') return `<span class="badge badge-pending">Pending</span>`;
  if(status==='approved') return `<span class="badge badge-approved">Approved</span>`;
  return `<span class="badge badge-rejected">Rejected</span>`;
}
function renderBarChart(dataPairs){
  const max = Math.max(1, ...dataPairs.map(d=>d[1]));
  return `<div class="bar-chart">${dataPairs.map(([lbl,val])=>`
    <div class="bar-col"><div class="bar-val">${val}</div>
    <div class="bar" style="height:${val===0?2:Math.max(6,(val/max)*130)}px;"></div>
    <div class="bar-lbl">${esc(lbl)}</div></div>`).join('')}</div>`;
}
function renderAnnouncementsList(limit){
  const list = db.announcements.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,limit);
  if(!list.length) return `<div class="empty-state">No announcements yet.</div>`;
  return list.map(a=>`
    <div class="list-item">
      <div class="list-item-head"><span class="list-item-title">${esc(a.title)}</span><span class="list-item-meta">${fmtDate(a.date)}</span></div>
      <div class="list-item-body">${esc(a.text)}</div>
      <div class="list-item-meta" style="margin-top:6px;">Posted by ${esc(a.by)}</div>
    </div>`).join('');
}

function renderTeacherTab(tab){

    const cls = state.selectedClass && myClasses.includes(state.selectedClass) ? state.selectedClass : myClasses[0];
    const roster = db.students.filter(s=>s.class===cls);
    const dateVal = state._attDate || todayStr();
    const marks = {}; db.attendance.filter(a=>a.class===cls && a.date===dateVal).forEach(a=>marks[a.admissionNumber]=a.status);
    return `<div class="content-head"><h2>Mark Attendance</h2><p>Select class and date, then mark each student.</p></div>

function renderAnalytics(scopeClasses){

  const now = new Date(); const months = [];
  for(let i=5;i>=0;i--){ let mm=now.getMonth()-i, yy=now.getFullYear(); while(mm<0){mm+=12; yy--;} months.push(yy+'-'+String(mm+1).padStart(2,'0')); }
  const lateByClass = scopeClasses.map(c=>[c, db.attendance.filter(a=>a.class===c && a.status==='late').length]);

/* ===================== SAMPLE DATA GENERATOR ===================== */
// Reads whatever students/teachers already exist (never renames or adds
// fake ones) and layers random-but-plausible attendance + remarks on top,
// plus today's Expo announcement.
const REMARK_TEMPLATES = [
  'Excellent participation in class discussions.',
  'Needs to submit pending homework on time.',
  'Showed great improvement this week.',
  'Please focus more during lab/practical sessions.',
  'Very well behaved and punctual.',
  'Good progress in the recent test.',
  'Should revise chapter notes more regularly.',
  'Active and helpful during group activities.',
  'Neat and well-organised classwork.',
  'Needs to work on time management during exams.'
];
function generateDemoData(){
  if(!db.students.length){ return {ok:false, msg:'Add at least one student first.'}; }
  const teacherNames = db.teachers.length ? db.teachers.map(t=>t.name) : [state.sub.name || 'Admin'];
  const statusPool = ['present','present','present','present','present','absent','late'];
  const pad2 = n=>String(n).padStart(2,'0');
  const toDateStr = d=> d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  mutate(d=>{
    const today = new Date();
    d.students.forEach(s=>{
      for(let i=0;i<18;i++){
        const day = new Date(today); day.setDate(day.getDate()-i);
        if(day.getDay()===0) continue; // skip Sundays
        const dateStr = toDateStr(day);
        if(d.attendance.some(a=>a.admissionNumber===s.admissionNumber && a.date===dateStr)) continue;
        const status = statusPool[Math.floor(Math.random()*statusPool.length)];
        const marker = teacherNames[Math.floor(Math.random()*teacherNames.length)];
        d.attendance.push({ admissionNumber:s.admissionNumber, class:s.class, date:dateStr, status, markedBy:marker });
      }
      const remarkCount = 1 + Math.floor(Math.random()*3);
      for(let i=0;i<remarkCount;i++){
        const text = REMARK_TEMPLATES[Math.floor(Math.random()*REMARK_TEMPLATES.length)];
        const by = teacherNames[Math.floor(Math.random()*teacherNames.length)];
        const day = new Date(today); day.setDate(day.getDate() - Math.floor(Math.random()*15));
        d.remarks.push({ id:uid(), admissionNumber:s.admissionNumber, text, by, date:toDateStr(day) });
      }
    });
    d.announcements.push({
      id:uid(), title:'Expo',
      text:'You are cordially invited to our School Expo! Join us to explore student projects, innovations, and achievements from across the school. We look forward to welcoming you.',
      date: todayStr(), by: state.sub.name || 'Admin'
    });
  });
  return {ok:true};
}

/* ===================== EVENT BINDING ===================== */
function bindEvents(){
  document.querySelectorAll('.portal-card').forEach(el=>{
    el.addEventListener('click', ()=>{ go('login', {role: el.dataset.role, sub:null}); });
  });
  const schoolLifeLink = document.getElementById('school-life-link');
  if(schoolLifeLink) schoolLifeLink.addEventListener('click', ()=>go('schoolLife'));

  const genDemoBtn = document.getElementById('gen-demo-data');
  if(genDemoBtn) genDemoBtn.addEventListener('click', ()=>{
    const okEl = document.getElementById('gen-demo-ok'), errEl = document.getElementById('gen-demo-err');
    okEl.textContent=''; errEl.textContent='';
    const result = generateDemoData();
    if(!result.ok){ errEl.textContent = result.msg; return; }
    showToast('Sample attendance, remarks & Expo announcement added');
  });
  const backToPortal = document.getElementById('back-to-portal');
  if(backToPortal) backToPortal.addEventListener('click', ()=>go('portalSelect'));

  const backBtn = document.getElementById('back-btn');
  if(backBtn) backBtn.addEventListener('click', ()=>go('portalSelect'));
  const loginBtn = document.getElementById('login-submit');
  if(loginBtn) loginBtn.addEventListener('click', doLogin);
  ['f-name','f-adm','f-code','f-pass'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  });

  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn) logoutBtn.addEventListener('click', ()=>{ state={view:'portalSelect', role:null, sub:null, tab:'overview', selectedClass:null}; render(); });

  document.querySelectorAll('.nav-item[data-tab]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.tab=el.dataset.tab; render(); });
  });
  document.querySelectorAll('[data-goto-school-life]').forEach(el=>{
    el.addEventListener('click', ()=>go('schoolLife'));
  });

  const lvType = document.getElementById('lv-type');
  if(lvType){
    const toggle=()=>{ document.getElementById('lv-doc-wrap').style.display = lvType.value==='sick' ? 'block':'none'; };
    lvType.addEventListener('change', toggle); toggle();
  }
  const lvSubmit = document.getElementById('lv-submit');
  if(lvSubmit) lvSubmit.addEventListener('click', ()=>{
    const type = document.getElementById('lv-type').value;
    const reason = document.getElementById('lv-reason').value.trim();
    const errEl = document.getElementById('lv-err'); errEl.textContent='';
    if(!reason){ errEl.textContent='Please enter a reason.'; return; }
    const fileInput = document.getElementById('lv-doc');
    const file = (type==='sick' && fileInput) ? fileInput.files[0] : null;
    if(type==='sick' && !file){ errEl.textContent='Please attach a medical certificate/prescription file.'; return; }
    if(file && file.size > 1.5*1024*1024){ errEl.textContent='File is too large — please use one under 1.5 MB.'; return; }
    const finish = (fileData, fileName)=>{
      mutate(d=>{ d.leaves.push({ id:uid(), admissionNumber: state.sub.admissionNumber, type, reason, fileData: fileData||null, fileName: fileName||null, status:'pending', date: todayStr() }); });
      showToast('Leave request submitted');
    };
    if(file){
      const reader = new FileReader();
      reader.onload = ()=> finish(reader.result, file.name);
      reader.onerror = ()=>{ errEl.textContent='Could not read that file — try another.'; };
      reader.readAsDataURL(file);
    } else finish(null, null);
  });

  const cxSubmit = document.getElementById('cx-submit');
  if(cxSubmit) cxSubmit.addEventListener('click', ()=>{
    const category = document.getElementById('cx-cat').value;
    const text = document.getElementById('cx-text').value.trim();
    if(!text){ showToast('Please describe your complaint', true); return; }
    mutate(d=>{ d.complaints.push({ id:uid(), source:'student', byAdm: state.sub.admissionNumber, category, text, date: todayStr() }); });
    showToast('Complaint submitted');
  });

  const tcxSubmit = document.getElementById('tcx-submit');
  if(tcxSubmit) tcxSubmit.addEventListener('click', ()=>{
    const adm = document.getElementById('tcx-adm').value.trim().toUpperCase();
    const category = document.getElementById('tcx-cat').value;
    const text = document.getElementById('tcx-text').value.trim();
    const errEl = document.getElementById('tcx-err');
    if(!adm || !text){ errEl.textContent='Please fill in all fields.'; return; }
    const stu = db.students.find(s=>s.admissionNumber.toUpperCase()===adm);
    if(!stu){ errEl.textContent='No student found with that admission number.'; return; }
    errEl.textContent='';
    mutate(d=>{ d.complaints.push({ id:uid(), source:'teacher', byName: state.sub.name, aboutAdm: stu.admissionNumber, category, text, date: todayStr() }); });
    showToast('Complaint filed');
  });

  document.querySelectorAll('[data-leave-approve]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id=el.dataset.leaveApprove;
      mutate(d=>{ const l=d.leaves.find(x=>x.id===id); if(l){ l.status='approved'; l.respondedBy=state.sub.name; } });
      showToast('Leave approved');
    });
  });
  document.querySelectorAll('[data-leave-reject]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id=el.dataset.leaveReject;
      mutate(d=>{ const l=d.leaves.find(x=>x.id===id); if(l){ l.status='rejected'; l.respondedBy=state.sub.name; } });
      showToast('Leave rejected');
    });
  });

  const rmSubmit = document.getElementById('rm-submit');
  if(rmSubmit) rmSubmit.addEventListener('click', ()=>{
    const adm = document.getElementById('rm-adm').value.trim().toUpperCase();
    const name = document.getElementById('rm-name').value.trim();
    const text = document.getElementById('rm-text').value.trim();
    const errEl = document.getElementById('rm-err');
    if(!adm || !name || !text){ errEl.textContent='Please fill in all fields.'; return; }
    const stu = db.students.find(s=>s.admissionNumber.toUpperCase()===adm);
    if(!stu){ errEl.textContent='No student found with that admission number.'; return; }
    errEl.textContent='';
    mutate(d=>{ d.remarks.push({ id:uid(), admissionNumber: stu.admissionNumber, text, by: state.sub.name, date: todayStr() }); });
    showToast('Remark posted');
  });

  const attClassSel = document.getElementById('att-class');
  if(attClassSel) attClassSel.addEventListener('change', ()=>{ state.selectedClass=attClassSel.value; render(); });
  const attDateInput = document.getElementById('att-date');
  if(attDateInput) attDateInput.addEventListener('change', ()=>{ state._attDate=attDateInput.value; render(); });
  const attSave = document.getElementById('att-save');
  if(attSave) attSave.addEventListener('click', ()=>{
    const cls = document.getElementById('att-class').value;
    const dateVal = document.getElementById('att-date').value || todayStr();
    const marks=[]; document.querySelectorAll('.att-status-select').forEach(s=> marks.push({adm:s.dataset.attAdm, status:s.value}));
    mutate(d=>{
      marks.forEach(m=>{
        const existing = d.attendance.find(a=>a.admissionNumber===m.adm && a.date===dateVal && a.class===cls);
        if(existing){ existing.status=m.status; existing.markedBy=state.sub.name; }
        else d.attendance.push({ admissionNumber:m.adm, date:dateVal, class:cls, status:m.status, markedBy: state.sub.name });
      });
    });
    showToast('Attendance saved');
  });

  const ttClassSelect = document.getElementById('tt-class-select');
  if(ttClassSelect) ttClassSelect.addEventListener('change', ()=>{ state.selectedClass=ttClassSelect.value; render(); });
  const ttSave = document.getElementById('tt-save');
  if(ttSave) ttSave.addEventListener('click', ()=>{
    const cls = state.selectedClass || getClassList()[0];
    const entries = {}; document.querySelectorAll('[data-tt-key]').forEach(i=> entries[i.dataset.ttKey]=i.value.trim());
    mutate(d=>{ d.timetable[cls]=entries; });
    showToast('Timetable saved for '+cls);
  });

  const hwSubmit = document.getElementById('hw-submit');
  if(hwSubmit) hwSubmit.addEventListener('click', ()=>{
    const cls = document.getElementById('hw-class').value;
    const subject = document.getElementById('hw-subject').value.trim();
    const text = document.getElementById('hw-text').value.trim();
    const due = document.getElementById('hw-due').value || todayStr();
    if(!subject || !text){ showToast('Please fill in subject and details', true); return; }
    mutate(d=>{ d.homework.push({ id:uid(), class:cls, subject, text, dueDate:due, by: state.sub.name, date: todayStr() }); });
    showToast('Homework posted');
  });

  const sylSubmit = document.getElementById('syl-submit');
  if(sylSubmit) sylSubmit.addEventListener('click', ()=>{
    const examName = document.getElementById('syl-exam').value.trim();
    const subject = document.getElementById('syl-subject').value.trim();
    const content = document.getElementById('syl-content').value.trim();
    if(!examName || !subject || !content){ showToast('Please fill in all fields', true); return; }
    mutate(d=>{ d.syllabus.push({ id:uid(), examName, subject, content, by: state.sub.name, date: todayStr() }); });
    showToast('Syllabus posted');
  });

  const anSubmit = document.getElementById('an-submit');
  if(anSubmit) anSubmit.addEventListener('click', ()=>{
    const title = document.getElementById('an-title').value.trim();
    const text = document.getElementById('an-text').value.trim();
    if(!title || !text){ showToast('Please fill in all fields', true); return; }
    mutate(d=>{ d.announcements.push({ id:uid(), title, text, by: state.sub.name, date: todayStr() }); });
    showToast('Announcement posted');
  });

  const stuSubmit = document.getElementById('stu-submit');
  if(stuSubmit) stuSubmit.addEventListener('click', ()=>{
    const adm = document.getElementById('stu-adm').value.trim().toUpperCase();
    const name = document.getElementById('stu-name').value.trim();
    const cls = document.getElementById('stu-class').value.trim();
    const errEl = document.getElementById('stu-err');
    if(!adm || !name || !cls){ errEl.textContent='Please fill in all fields.'; return; }
    if(!/^M0/.test(adm)){ errEl.textContent='Admission number must start with M0 (e.g. M01004).'; return; }
    if(db.students.some(s=>s.admissionNumber.toUpperCase()===adm)){ errEl.textContent='This admission number already exists.'; return; }
    errEl.textContent='';
    mutate(d=>{ const clsFinal = registerClass(cls); d.students.push({ admissionNumber: adm, name, class: clsFinal }); });
    showToast('Student added');
  });
  document.querySelectorAll('[data-del-student]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const adm = el.dataset.delStudent;
      mutate(d=>{ d.students = d.students.filter(s=>s.admissionNumber!==adm); });
      showToast('Student removed');
    });
  });

  const tSubmit = document.getElementById('t-submit');
  if(tSubmit) tSubmit.addEventListener('click', ()=>{
    const name = document.getElementById('t-name').value.trim();
    const code = document.getElementById('t-code').value.trim().toUpperCase();
    const classesRaw = document.getElementById('t-classes').value.trim();
    const classes = classesRaw ? classesRaw.split(',').map(c=>c.trim()).filter(Boolean) : [];
    const errEl = document.getElementById('t-err');
    if(!name || !code){ errEl.textContent='Please fill in name and code.'; return; }
    if(db.teachers.some(t=>t.code.toUpperCase()===code)){ errEl.textContent='This teacher code already exists.'; return; }
    errEl.textContent='';
    mutate(d=>{ const normClasses = classes.map(c=>registerClass(c)); d.teachers.push({ name, code, classes: normClasses }); });
    showToast('Teacher added');
  });
  document.querySelectorAll('[data-del-teacher]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const code = el.dataset.delTeacher;
      mutate(d=>{ d.teachers = d.teachers.filter(t=>t.code!==code); });
      showToast('Teacher removed');
    });
  });
}

/* ===================== BOOT ===================== */
loadDB();
render();
</script>
</body>
</html>
